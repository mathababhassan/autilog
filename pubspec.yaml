name: autilog
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  cloud_functions: ^6.3.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  speech_to_text: ^7.0.0
  pdf: ^3.11.0
  printing: ^5.13.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^14.8.1
  formz: ^0.7.0
  flutter_svg: ^2.0.10+1

  # ✅ FIXED: moved here
  image_picker: ^1.0.7
  video_thumbnail: ^0.5.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  video_player: ^2.11.1
  chewie: ^1.14.1
  fl_chart: ^1.2.0
  firebase_messaging: ^16.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/autilog_logo.png"
  adaptive_icon_background: "#FA8601"
  adaptive_icon_foreground: "assets/images/autilog_logo.png"